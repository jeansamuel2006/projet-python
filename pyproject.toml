[tool.poetry]
name = "python-homework"
version = "0.1.0"
description = ""
authors = ["Assan Akossi Jean-Samuel <jeansamuel2006@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
ignore_missing_imports = true